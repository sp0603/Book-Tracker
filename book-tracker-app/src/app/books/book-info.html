<add-book-button (newBookAdded)="newBookAdded($event)"></add-book-button>
<!-- loop to display all the books that are added -->
@for (book of books; track book.id) {
  <div class="book-information">
    <p class="info-title">{{ book.title }}</p>
    <p>Author: {{ book.author }}</p>
    <p>Status: {{ statusDisplay[book.status] }}</p>
    <drop-drown-status [book]="book" (statusChanged)="onStatusChanged($event)"></drop-drown-status
    ><delete-button [book]="book" (bookDeleted)="onBookDeleted($event)"> </delete-button>
  </div>
}
